name: Factory Flooring Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests

      - name: Run scraper
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          ls -la output/

      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add scrapers/output/
          git diff --staged --quiet || git commit -m "factory flooring $(date '+%Y-%m-%d')"
          git push origin main
