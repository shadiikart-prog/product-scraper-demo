name: Factory Flooring Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        timeout-minutes: 25
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          echo "=== Output files ==="
          ls -la output/ || echo "No output folder"

      - name: Push to GitHub
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git pull origin main --rebase || true
          git add scrapers/output/ || true
          git diff --staged --quiet || git commit -m "Factory flooring CSV $(date '+%Y-%m-%d')"
          git push origin main
