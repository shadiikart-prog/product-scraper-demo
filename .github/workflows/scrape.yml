name: Factory Flooring Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install requests playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        timeout-minutes: 45
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          echo "=== CSV ==="
          ls -lh output/*.csv 2>/dev/null || echo "No CSV"
          echo "=== Images ==="
          ls output/images/ 2>/dev/null | wc -l || echo "0 images"

      - name: Push everything to GitHub
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@example.com"
          git pull origin main --rebase || true
          git add scrapers/output/
          git diff --staged --quiet || git commit -m "Flooring data + images $(date '+%Y-%m-%d %H:%M')"
          git push origin main
