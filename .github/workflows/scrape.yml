name: Complete Website Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run complete scraper
        timeout-minutes: 50
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          echo "=== Output files ==="
          ls -la output/

      - name: Push all output files
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git pull origin main --rebase || true
          git add scrapers/output/
          git diff --staged --quiet || git commit -m "Complete scrape $(date '+%Y-%m-%d')"
          git push origin main
