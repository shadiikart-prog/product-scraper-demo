name: Factory Flooring Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        timeout-minutes: 25
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          echo ""
          echo "=== Files in output folder ==="
          ls -la output/ || echo "No output folder!"

      - name: Commit and push CSV
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@example.com"
          git pull origin main --rebase || true
          git add scrapers/output/ || true
          git diff --staged --quiet || git commit -m "Factory flooring CSV $(date '+%Y-%m-%d %H:%M')"
          git push origin main || echo "Nothing to push"
