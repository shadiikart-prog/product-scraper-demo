name: Factory Flooring Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Run Factory Flooring Scraper
        timeout-minutes: 5000
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          echo "=== Files created ==="
          ls -la output/

      - name: Push CSV to GitHub
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add scrapers/output/
          git diff --staged --quiet || git commit -m "Factory flooring data $(date '+%Y-%m-%d')"
          git push origin main
