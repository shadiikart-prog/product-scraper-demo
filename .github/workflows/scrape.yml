name: Factory Flooring Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        timeout-minutes: 50
        run: |
          cd scrapers
          python scraper_factoryflooring_shopify.py
          echo "=== CSV files ==="
          ls -lh output/*.csv || echo "No CSV"
          echo "=== Images ==="
          ls output/images/ | wc -l || echo "No images"

      - name: Commit and push everything
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@example.com"
          git pull origin main --rebase || true
          git add scrapers/output/
          git diff --staged --quiet || git commit -m "Factory flooring data + images $(date '+%Y-%m-%d %H:%M')"
          git push origin main
